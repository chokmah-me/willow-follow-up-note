  "abstract": "This note scores Google's 2026 magic-state cultivation experiment on Willow against the six error channels inventoried in the author's 2024 note, and fixes in advance the experiment that would settle the one channel it hits. Four channels were omitted or treated thinly by the simplified noise model behind Google's 2024 predictions: leakage, crosstalk, correlated errors, and classical chaos. Gate and readout sat inside that model as the baseline. The cultivation experiment grafts a magic state from a distance-3 color code into a distance-5 code that mixes color-code and surface-code stabilizers. Supplement claims are from arXiv preprint v1. Leakage is a likely hit (attributed, not ablated). In the supplement's grafted-code memory experiment, the logical error rate is about seven times a depolarizing simulation that omits leakage. The authors name leakage as the likely main cause, trace its entry to readout parameters not optimized for a redefined measurement layout, and show two leakage signatures in the detector data. The circuits had no leakage removal units, and no removal run exists. Variability in physical qubit performance, named beside leakage on an earlier grafting figure, stays open. A hit means a model that omits the channel mispredicts the hardware by a stated factor, with the experimenters' own attribution. Crosstalk is mentioned. Correlated errors are present but not independent of the leakage evidence. Gate and readout remain baseline. Classical chaos is untested. The settling experiment crosses leakage removal with readout re-optimization, requires three-state readout in every arm, and fixes its pass margin before the run.",
