  "abstract": "Google's 2026 magic-state cultivation experiment on Willow grafts a cultivated magic state from a distance-3 color code into a distance-5 code that mixes color-code and surface-code stabilizers. In the supplement's memory experiment on that grafted code, the logical error rate is about seven times a depolarizing simulation that omits leakage. The authors call leakage the likely main cause, show two leakage signatures in the detector data, and ran no removal experiment. This note makes three contributions. First, a reading of the attribution: the authors trace leakage to readout parameters not optimized for a redefined measurement layout, so a readout fix that closes the gap would not by itself refute leakage. The note separates that route from two others that would: readout errors that never populate the |2> state, and variability in physical qubit performance, which the main text names beside leakage on an earlier grafting figure. Second, a record check: the public data deposit holds no files for the nine-cycle run behind the attribution, so no outside party can test it numerically. Third, a pre-registered experiment: leakage removal crossed with readout re-optimization, three-state readout in every arm, the noise strength frozen from a separate control, and pass margins fixed before the run, with a reading assigned to each outcome. Until that experiment runs, the attribution stays likely and not ablated.",
