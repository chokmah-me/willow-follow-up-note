  "abstract": "In December 2024 I published a short note on Google's Willow surface-code paper. The note's core was an inventory of six error channels that the simplified noise model treated thinly: gate, readout, leakage, crosstalk, correlated, and classical chaos. In October 2026 Google published magic-state cultivation on Willow, a state-preparation protocol that switches a distance-3 color code into a distance-5 surface code. This note scores that experiment against the six channels. Leakage is a likely hit (attributed, not ablated). The authors name population leakage as the likely main cause of a logical error rate about seven times the grafted-code simulation in preprint v1 of the supplement. Leakage signatures are in that data, leakage is absent from the noise model and from the circuits, no ablation run exists, and variability in physical qubit performance stays open as a second cause. Standard tomography failed under low-frequency phase noise. Echo plus kickback tomography restored the measurement, with a residual detuning bound near 1e-5 in the same preprint. Crosstalk is mentioned. Gate and readout are the experiment's baseline. Classical chaos is untested. The seven-fold gap is one supplement memory experiment, one grafted configuration, up to nine cycles, in preprint v1. Nothing in the 2024 note is contradicted by this experiment. The inventory is not confirmed by it.",
