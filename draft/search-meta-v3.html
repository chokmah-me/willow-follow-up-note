  "abstract": "The 2024 note on Google's Willow surface-code paper inventoried six error channels. Four were omitted or treated thinly by the simplified noise model: leakage, crosstalk, correlated errors, and classical chaos. Gate and readout sat inside that model as the baseline. In October 2026 Google published magic-state cultivation on Willow, switching a distance-3 color code into a distance-5 surface code. This note scores that experiment against the six channels. Supplement claims are from arXiv preprint v1. Leakage is a likely hit (attributed, not ablated). In the supplement's grafted-code memory experiment, the authors name population leakage as the likely main cause of a logical error rate about seven times the simulation. Signatures are in the data, leakage is absent from the model and the circuits, and no removal run exists. That section's other candidates are unoptimized readout parameters and |2> frequency collisions after the grafting circuit redefines which qubits are measured. Variability in physical qubit performance is left open on an earlier grafting figure, next to an injection-only tomography mismatch. The residual detuning bound near 1e-5 is a simulated bound under assumed plus or minus 200 kHz quasi-static detunings, with no depolarizing noise. Crosstalk is mentioned. Correlated errors are present in the detector data and are not scored on their own. Gate and readout remain the baseline. Classical chaos is untested. The seven-fold gap is one configuration and at most nine cycles. It is weak evidence on its own. The leakage score rests on the signatures. The 2024 inventory is not confirmed.",
